<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Competition Live Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="banner.png" alt="Event Banner" class="header-img" style="max-width:180px; height:auto;">
    <img src="logo.png" alt="Event Logo" style="height:150px;">
  </header>

  <main>
    <!-- Sticky Filter Bar -->
    <div id="stickyFilterBar">
      <div class="category-buttons" id="globalCategoryButtons">
        <button onclick="updateGlobalCategory('HS')">HS</button>
        <button onclick="updateGlobalCategory('HSS')">HSS</button>
        <button onclick="updateGlobalCategory('UP')">UP</button>
      </div>
      <input type="text" id="eventSearchInput" placeholder="Search for event..." oninput="updateEventSearch()">
    </div>

    <div id="leaderboard">Loading live results...</div>
  </main>

  <footer>
    <p>© 2025 GGHSS Cottonhill</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
